<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13151b">
<title>GloorpFlorp lobby</title>
<style>
  :root { --bg: #13151b; --card: #1d2029; --border: #2e323f; --field: #0d0e12; --text: #dee1e8;
          --weak: #8a90a0; --accent: #5684ff; --green: #5ac86e; --yellow: #e6be46; --grey: #969696;
          --orange: #f08c3c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) 0 0; }
  header { padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--border); }
  h1 { margin: 0; font-size: 18px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #status { font-size: 14px; color: var(--weak); }
  #members { display: flex; gap: 6px 12px; flex-wrap: wrap; margin-top: 6px; font-size: 14px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  #chat { flex: 1; overflow-y: auto; padding: 10px 14px; background: var(--field); }
  .line { margin: 0 0 10px; overflow-wrap: anywhere; }
  .when { color: var(--weak); font-size: 13px; margin-right: 6px; }
  .who { font-weight: 600; margin-right: 6px; }
  .line img { display: block; max-width: 100%; max-height: 50vh; margin-top: 4px; border-radius: 6px; }
  .file { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px;
          padding: 8px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
  footer { padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--card);
           border-top: 1px solid var(--border); }
  input[type=text] { flex: 1; min-width: 0; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
                     background: var(--field); color: var(--text); font-size: 16px; }
  button, .button { padding: 10px 14px; border-radius: 8px; border: 0; background: #2a2e3b; color: var(--text);
                    font-size: 15px; text-decoration: none; cursor: pointer; }
  button.main, .button.main { background: var(--accent); color: #fff; }
  button:disabled { opacity: .5; }
  #name { flex: 0 1 140px; padding: 6px 8px; font-size: 14px; }
  #jobs:empty { display: none; }
  #jobs { margin-bottom: 8px; font-size: 14px; }
  .job progress { width: 100%; height: 10px; }
  .problem { color: var(--orange); font-size: 14px; }
  #big { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center;
         justify-content: center; }
  #big img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<header>
  <div class="row"><h1>GloorpFlorp lobby</h1><span id="status">Connecting…</span></div>
  <div class="row" style="margin-top:6px">
    <label for="name" style="font-size:14px;color:var(--weak)">Your name</label>
    <input id="name" type="text" maxlength="40" autocomplete="nickname">
  </div>
  <div id="members"></div>
</header>
<main id="chat" aria-live="polite"><p class="when">No messages yet.</p></main>
<footer>
  <div id="jobs"></div>
  <div class="row">
    <input id="text" type="text" maxlength="1000" placeholder="Message" aria-label="Chat message" enterkeyhint="send">
    <button id="send" class="main">Send</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="pic">Picture</button>
    <button id="file">Send file</button>
    <input id="picInput" type="file" accept="image/*" hidden>
    <input id="fileInput" type="file" hidden>
  </div>
</footer>
<div id="big" role="dialog" aria-label="Picture, large. Tap to close."><img alt=""></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const nameBox = $("name");
nameBox.value = localStorage.getItem("gf-name") || "Phone";
nameBox.addEventListener("change", () => localStorage.setItem("gf-name", nameBox.value.trim() || "Phone"));
const who = () => nameBox.value.trim() || "Phone";
// Every request the page makes carries this header, which the server wants on a POST.
const ours = { "X-Gloorp": "1" };

const size = (b) => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : b >= 1e6 ? (b / 1e6).toFixed(1) + " MB"
  : b >= 1e3 ? Math.round(b / 1e3) + " KB" : b + " bytes";
function ago(at) {
  const s = Math.max(0, Date.now() / 1000 - at);
  return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + " min ago"
    : s < 86400 ? Math.floor(s / 3600) + " h ago" : Math.floor(s / 86400) + " d ago";
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

let next = 0;
const chat = $("chat");
function addLine(c) {
  if (next === 0 && chat.firstElementChild && chat.firstElementChild.tagName === "P") chat.textContent = "";
  const line = el("div", "line");
  if (c.at) line.append(el("span", "when", ago(c.at)));
  line.append(el("span", "who", c.name + ":"));
  if (c.text) line.append(el("span", "", c.text));
  if (c.image) {
    const img = el("img");
    // The server only passes on PNG and JPEG; base64 PNGs start with "iVBOR".
    img.src = "data:image/" + (c.image.startsWith("iVBOR") ? "png" : "jpeg") + ";base64," + c.image;
    img.alt = "Picture from " + c.name;
    img.onclick = () => { $("big").querySelector("img").src = img.src; $("big").style.display = "flex"; };
    line.append(img);
  }
  if (c.file) {
    const box = el("div", "file");
    box.append(el("strong", "", c.file.name + " (" + size(c.file.size) + ")"));
    const a = el("a", "button main", "Download");
    a.href = "/file/" + encodeURIComponent(c.file.id) + "?name=" + encodeURIComponent(c.file.name);
    a.download = c.file.name;
    a.setAttribute("aria-label", "Download " + c.file.name);
    box.append(a);
    line.append(box);
  }
  const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60;
  chat.append(line);
  if (atBottom) chat.scrollTop = chat.scrollHeight;
}
$("big").onclick = () => { $("big").style.display = "none"; };

function showMembers(list, me) {
  const box = $("members");
  box.textContent = "";
  const colour = { lobby: "var(--green)", online: "var(--yellow)", offline: "var(--grey)" };
  const words = { lobby: "in the lobby", online: "online", offline: "offline" };
  for (const m of list) {
    const span = el("span");
    const dot = el("span", "dot");
    dot.style.background = colour[m.state];
    span.append(dot, m.name + (m.id === me ? " (you)" : ""));
    span.title = words[m.state];
    span.setAttribute("aria-label", m.name + ", " + words[m.state]);
    box.append(span);
  }
}

async function poll() {
  try {
    const r = await fetch("/poll?name=" + encodeURIComponent(who()) + "&since=" + next, { headers: ours });
    if (!r.ok) throw new Error(await r.text());
    const p = await r.json();
    // The server restarted: its count started again.
    if (p.next < next) { next = 0; chat.textContent = ""; }
    for (const c of p.lines) addLine(c);
    next = p.next;
    showMembers(p.members, p.you);
    $("status").textContent = "Connected";
    $("status").style.color = "var(--green)";
  } catch (e) {
    $("status").textContent = "Can't reach the lobby. Is Tailscale on?";
    $("status").style.color = "var(--orange)";
  }
  setTimeout(poll, 2000);
}

async function post(text, image) {
  const body = JSON.stringify(image ? { text, image } : { text });
  const r = await fetch("/chat?name=" + encodeURIComponent(who()), {
    method: "POST", headers: { ...ours, "Content-Type": "application/json" }, body });
  if (!r.ok) throw new Error(await r.text());
}

function note(text) {
  const p = el("div", "problem", text);
  $("jobs").append(p);
  setTimeout(() => p.remove(), 10000);
}

$("send").onclick = async () => {
  const text = $("text").value.trim();
  if (!text) return;
  $("send").disabled = true;
  try { await post(text); $("text").value = ""; } catch (e) { note(e.message); }
  $("send").disabled = false;
  $("text").focus();
};
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter") $("send").click(); });

// A picture is shrunk to at most 1600 pixels and 1 MB as a JPEG, like the app does.
function loadImage(file) {
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => fail(new Error("That picture can't be read."));
    img.src = URL.createObjectURL(file);
  });
}
async function shrink(file) {
  const img = await loadImage(file);
  let side = 1600;
  for (let quality = 0.85; ; ) {
    const scale = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * scale));
    c.height = Math.max(1, Math.round(img.naturalHeight * scale));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL("image/jpeg", quality);
    const b64 = url.slice(url.indexOf(",") + 1);
    if (b64.length * 3 / 4 <= 1000000 || side < 200) return b64;
    if (quality > 0.6) quality -= 0.15; else side = Math.round(side / 2);
  }
}
$("pic").onclick = () => $("picInput").click();
$("picInput").onchange = async () => {
  const f = $("picInput").files[0];
  $("picInput").value = "";
  if (!f) return;
  try { await post($("text").value.trim(), await shrink(f)); $("text").value = ""; }
  catch (e) { note(e.message); }
};

// Files go up as they are (up to 64 GB), shown with progress; they then appear in the chat.
$("file").onclick = () => $("fileInput").click();
$("fileInput").onchange = () => {
  for (const f of $("fileInput").files) upload(f);
  $("fileInput").value = "";
};
function upload(f) {
  const job = el("div", "job");
  const label = el("div", "", "Sending " + f.name);
  const bar = el("progress");
  bar.max = f.size || 1;
  bar.value = 0;
  const cancel = el("button", "", "Cancel");
  job.append(label, bar, cancel);
  $("jobs").append(job);
  const xhr = new XMLHttpRequest();
  const started = Date.now();
  xhr.open("POST", "/upload?name=" + encodeURIComponent(who()) + "&file=" + encodeURIComponent(f.name));
  xhr.setRequestHeader("X-Gloorp", "1");
  xhr.upload.onprogress = (e) => {
    bar.value = e.loaded;
    const speed = e.loaded / Math.max(0.1, (Date.now() - started) / 1000);
    label.textContent = "Sending " + f.name + ": " + Math.floor(e.loaded * 100 / (f.size || 1)) + "%, "
      + size(e.loaded) + " of " + size(f.size) + ", " + size(speed) + "/s";
  };
  const done = (text) => { job.textContent = text; setTimeout(() => job.remove(), 8000); };
  xhr.onload = () => done(xhr.status === 200 ? "Sent " + f.name + "." : f.name + ": " + xhr.responseText);
  xhr.onerror = () => done(f.name + ": the connection to the lobby broke off. Try again.");
  xhr.onabort = () => done(f.name + ": cancelled.");
  cancel.onclick = () => xhr.abort();
  xhr.send(f);
}

poll();
</script>
</body>
</html>
