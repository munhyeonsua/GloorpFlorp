[package]
name = "gloorpflorp"
description = "Private two-person screen sharing and voice chat over Tailscale"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The engine and settings live in a library so the end-to-end test can drive
# two engines without a window.
[lib]
name = "gloorpflorp"
path = "src/lib.rs"

[[bin]]
name = "GloorpFlorp"
path = "src/main.rs"

[dependencies]
gf-proto.workspace = true
gf-net.workspace = true
gf-video.workspace = true
gf-audio.workspace = true
gf-sys.workspace = true
gf-lobby.workspace = true
anyhow.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
egui.workspace = true
directories.workspace = true
simplelog.workspace = true
# Pictures in the lobby chat: decoding, shrinking, and reading the clipboard.
image.workspace = true
arboard.workspace = true

[target.'cfg(windows)'.dependencies]
# Only for the message box shown when the window can't open.
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }
